<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>Cruce de Cargos</title>
<style id="fi-style">
:root{
  --ink:#221D19; --muted:#6E655C; --paper:#F5F7F6; --surface:#FFFFFF;
  --line:#E3E1DC; --line-strong:#CFCBC2;
  --accent:#2D7B6B;
  --good:#2D7B6B; --good-bg:#E4F1EE;
  --warn:#B8712F; --warn-bg:#F8ECDD;
  --bad:#A6433D; --bad-bg:#F7E6E4;
  --neutral:#6B7581; --neutral-bg:#EBEAE7;
  --shadow: 0 1px 2px rgba(34,29,25,0.06), 0 8px 24px -12px rgba(34,29,25,0.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECE8E1; --muted:#A79E92; --paper:#141B19; --surface:#1B2422;
    --line:#2B3532; --line-strong:#3A4642;
    --accent:#59B39F;
    --good:#59B39F; --good-bg:#1E3833;
    --warn:#E0A15C; --warn-bg:#3A2E1D;
    --bad:#E08880; --bad-bg:#3B2422;
    --neutral:#9AA3AC; --neutral-bg:#2A2F33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --ink:#ECE8E1; --muted:#A79E92; --paper:#141B19; --surface:#1B2422;
  --line:#2B3532; --line-strong:#3A4642;
  --accent:#59B39F;
  --good:#59B39F; --good-bg:#1E3833;
  --warn:#E0A15C; --warn-bg:#3A2E1D;
  --bad:#E08880; --bad-bg:#3B2422;
  --neutral:#9AA3AC; --neutral-bg:#2A2F33;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.45}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;margin:0}
a{color:var(--accent)}
#root{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 20px 14px}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-0.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.pill:hover{border-color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.readonly-banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 14px;font-size:12.5px;margin:14px 0}
section{margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:19px;font-weight:600}
.section-head .note{color:var(--muted);font-size:12.5px;max-width:540px}
.kpi-grid{display:grid;grid-template-columns:1.05fr 2fr;gap:16px}
@media (max-width:820px){.kpi-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.hero-card{padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:center}
.hero-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero-num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:54px;font-weight:600;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-sub{color:var(--muted);font-size:13px;margin-top:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:25px;font-weight:600}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .pct{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.bars{padding:18px 22px 20px;display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:150px 1fr 104px;align-items:center;gap:10px}
.bar-row .name{font-size:13px;font-weight:600}
.bar-track{background:var(--neutral-bg);border-radius:5px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.bar-val{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;text-align:right;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:9px 13px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13.5px;font-family:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.count-badge{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1120px;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.sin{background:var(--bad-bg);color:var(--bad)}
.chip.fuera{background:var(--warn-bg);color:var(--warn)}
.chip.sede{background:var(--neutral-bg);color:var(--neutral);font-weight:600}
.chip.confirm{background:var(--good-bg);color:var(--good)}
tr.row-confirmed td{background:var(--good-bg)}
tr.row-confirmed:hover td{background:var(--good-bg)}
.confirm-check{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px;cursor:pointer}
.confirm-check input{accent-color:var(--good);cursor:pointer}
.cargo-cell{font-size:12px;color:var(--muted);max-width:220px}
.cargo-cell .cc{color:var(--ink);display:block;margin-bottom:1px}
.diff{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;white-space:nowrap}
.comment-input{width:220px;min-height:42px;resize:vertical;padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font-family:inherit;font-size:12.5px}
.comment-input:focus{outline:2px solid var(--accent);outline-offset:1px}
.comment-input:disabled{opacity:.65;cursor:not-allowed}
.save-state{font-size:10.5px;color:var(--muted);margin-top:3px;min-height:12px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
footer{margin-top:48px;color:var(--muted);font-size:11.5px;text-align:center}
</style>

nal":"Laboratorio FIV/Andrología","profesionalHistoria":"Laboratorio FIV/Andrología","id":"labo-4d6cfda9d3","ejecutiva":"Sin asignar","medicoEjecutiva":null,"tipoMatchEjecutiva":"sin_resolver"},{"grupo":"Laboratorio FIVANDRO","sede":"GDL","sedeLabel":"Guadalajara","nhc":null,"paciente":"Estrada Enríquez, Omar Antonio","fecha":"2026-08-01","concepto":"Fragmentación del ADN espermático","estatus":"Match Encontrado","conceptoCargo":"Fragmentación del ADN espermático","fechaCargo":"2026-08-01","diffDias":0,"profesional":"Laboratorio FIV/Andrología","profesionalHistoria":null,"id":"labo-ee487da68c","ejecutiva":"Sin asignar","medicoEjecutiva":null,"tipoMatchEjecutiva":"sin_resolver"},{"grupo":"Laboratorio FIVANDRO","sede":"GDL","sedeLabel":"Guadalajara","nhc":null,"paciente":"Rochín Castillo, Jesús Aarón","fecha":"2026-08-01","concepto":"Espermatobioscopía (ED)","estatus":"Match Encontrado","conceptoCargo":"Espermatobioscopía (ED)","fechaCargo":"2026-08-01","diffDias":0,"profesional":"Laboratorio FIV/Andrología","profesionalHistoria":null,"id":"labo-120e59badf","ejecutiva":"Sin asignar","medicoEjecutiva":null,"tipoMatchEjecutiva":"sin_resolver"},{"grupo":"Laboratorio FIVANDRO","sede":"GDL","sedeLabel":"Guadalajara","nhc":238630544457,"paciente":"Campos Valdivia, José","fecha":"2026-08-01","concepto":"Espermatobioscopía (ED)","estatus":"Match Encontrado","conceptoCargo":"Espermatobioscopía (ED)","fechaCargo":"2026-08-01","diffDias":0,"profesional":"Laboratorio FIV/Andrología","profesionalHistoria":"Laboratorio FIV/Andrología","id":"labo-b0fda6cfba","ejecutiva":"Sin asignar","medicoEjecutiva":null,"tipoMatchEjecutiva":"sin_resolver"},{"grupo":"Laboratorio FIVANDRO","sede":"CDMX","sedeLabel":"Ciudad de México","nhc":null,"paciente":"Hernandez Hernandez, Carlos Alberto","fecha":"2026-08-01","concepto":"Fragmentación del ADN espermático","estatus":"Match Encontrado","conceptoCargo":"Fragmentación del ADN espermático","fechaCargo":"2026-08-01","diffDias":0,"profesional":"Labora <script id="fi-app-src">
(function () {
  'use strict';

  var DATA = window.__FI_DATA__ || [];
  var COMMENTS = window.__FI_COMMENTS__ || {};
  var CORTE_LABEL = '26/08/2026';

  var SEDES = [
    { key: 'ALL', label: 'Todas las sedes' },
    { key: 'CDMX', label: 'Ciudad de México' },
    { key: 'GDL', label: 'Guadalajara' },
    { key: 'Metepec', label: 'Metepec' }
  ];

  var GRUPO_ORDER = ['Consultorio', 'Primera Vez', 'Quirófano', 'Seguimiento', 'Wellness', 'Laboratorio FIVANDRO'];

  // Orden preferido de ejecutivas (las de la hoja "Experiencia"); cualquier otra
  // que aparezca en los datos se agrega al final, y "Sin asignar" siempre al final.
  var EJECUTIVA_ORDER = ['Reyna', 'Sharon', 'Lucía', 'Jacqueline', 'Wendy', 'Alondra', 'Viviana', 'Externos'];

  function getEjecutivas() {
    var present = {};
    DATA.forEach(function (r) { if (r.ejecutiva) present[r.ejecutiva] = true; });
    var known = EJECUTIVA_ORDER.filter(function (e) { return present[e]; });
    var extra = Object.keys(present).filter(function (e) {
      return known.indexOf(e) === -1 && e !== 'Sin asignar';
    }).sort();
    var list = known.concat(extra);
    if (present['Sin asignar']) list.push('Sin asignar');
    return list;
  }

  var STATUS_META = {
    'Match Encontrado': { short: 'Match', varName: '--good', bgVar: '--good-bg' },
    'Fuera de Rango de Fecha': { short: 'Fuera de Rango', varName: '--warn', bgVar: '--warn-bg' },
    'No Aplica Cruce (regla)': { short: 'No Aplica', varName: '--neutral', bgVar: '--neutral-bg' },
    'Sin Match': { short: 'Sin Match', varName: '--bad', bgVar: '--bad-bg' },
    'Confirmado por Equipo': { short: 'Confirmado por equipo', varName: '--good', bgVar: '--good-bg' }
  };

  var state = { sede: 'ALL', statusFilter: 'ALL', search: '', grupo: 'ALL', ejecutiva: 'ALL' };
  var artifactApi = null;
  var artifactReady = false;
  var saveTimers = {};

  // ---------- helpers ----------
  function fmtInt(n) { return (n || 0).toLocaleString('es-MX'); }
  function pct1(n) { return (isFinite(n) ? n : 0).toFixed(1) + '%'; }
  function fmtDate(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tierVar(pct) {
    if (pct >= 80) return 'var(--good)';
    if (pct >= 60) return 'var(--warn)';
    return 'var(--bad)';
  }
  function cargoCount(s) {
    return (s['Match Encontrado'] || 0) + (s['Fuera de Rango de Fecha'] || 0) + (s['No Aplica Cruce (regla)'] || 0) + (s['Confirmado por Equipo'] || 0);
  }

  // Un comentario puede marcar una cita 'Sin Match' o 'Fuera de Rango' como confirmada
  // con cargo por el equipo -- en ese caso, para efectos de estadísticas, se reclasifica
  // a 'Confirmado por Equipo' (que SÍ cuenta dentro del % de cargo). El estatus original
  // de la auditoría no se pierde: sigue visible en la tabla de detalle.
  function effectiveStatus(row) {
    var note = COMMENTS[row.id];
    if (note && note.cargado && (row.estatus === 'Sin Match' || row.estatus === 'Fuera de Rango de Fecha')) {
      return 'Confirmado por Equipo';
    }
    return row.estatus;
  }

  function computeStats(records) {
    var s = { total: records.length, 'Match Encontrado': 0, 'Fuera de Rango de Fecha': 0, 'No Aplica Cruce (regla)': 0, 'Sin Match': 0, 'Confirmado por Equipo': 0 };
    for (var i = 0; i < records.length; i++) {
      var e = effectiveStatus(records[i]);
      if (s[e] === undefined) s[e] = 0;
      s[e]++;
    }
    return s;
  }

  function bySede(records, sedeKey) {
    if (sedeKey === 'ALL') return records;
    return records.filter(function (r) { return r.sede === sedeKey; });
  }

  function byEjecutiva(records, ejecutivaKey) {
    if (ejecutivaKey === 'ALL') return records;
    return records.filter(function (r) { return r.ejecutiva === ejecutivaKey; });
  }

  // Registros dentro del alcance actual (sede + ejecutiva). Sirve de base tanto
  // para el KPI y las barras por grupo como para la tabla de detalle.
  function scopedRecords() {
    return byEjecutiva(bySede(DATA, state.sede), state.ejecutiva);
  }

  function groupStats(records) {
    var byGrupo = {};
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (!byGrupo[r.grupo]) byGrupo[r.grupo] = { grupo: r.grupo, total: 0, 'Match Encontrado': 0, 'Fuera de Rango de Fecha': 0, 'No Aplica Cruce (regla)': 0, 'Sin Match': 0, 'Confirmado por Equipo': 0 };
      byGrupo[r.grupo].total++;
      var e = effectiveStatus(r);
      byGrupo[r.grupo][e] = (byGrupo[r.grupo][e] || 0) + 1;
    }
    var arr = GRUPO_ORDER.filter(function (g) { return byGrupo[g]; }).map(function (g) { return byGrupo[g]; });
    arr.forEach(function (g) { g.pct = g.total ? (cargoCount(g) / g.total) * 100 : 0; });
    arr.sort(function (a, b) { return b.pct - a.pct; });
    return arr;
  }

  function detailRows() {
    var rows = scopedRecords().filter(function (r) {
      return r.estatus === 'Sin Match' || r.estatus === 'Fuera de Rango de Fecha';
    });
    if (state.statusFilter !== 'ALL') {
      rows = rows.filter(function (r) {
        return state.statusFilter === 'SIN' ? r.estatus === 'Sin Match' : r.estatus === 'Fuera de Rango de Fecha';
      });
    }
    if (state.grupo !== 'ALL') rows = rows.filter(function (r) { return r.grupo === state.grupo; });
    if (state.search.trim()) {
      var q = state.search.trim().toLowerCase();
      rows = rows.filter(function (r) {
        return (r.paciente || '').toLowerCase().indexOf(q) !== -1 ||
          (r.concepto || '').toLowerCase().indexOf(q) !== -1 ||
          (r.profesional || '').toLowerCase().indexOf(q) !== -1 ||
          (r.ejecutiva || '').toLowerCase().indexOf(q) !== -1 ||
          (String(r.nhc || '')).indexOf(q) !== -1;
      });
    }
    rows.sort(function (a, b) {
      if (a.fecha === b.fecha) return (a.paciente || '').localeCompare(b.paciente || '');
      return (b.fecha || '').localeCompare(a.fecha || '');
    });
    return rows;
  }

  // ---------- render: top KPI ----------
  function renderKPI(root) {
    var scoped = scopedRecords();
    var stats = computeStats(scoped);
    var pct = stats.total ? (cargoCount(stats) / stats.total) * 100 : 0;
    var sedeLabel = SEDES.filter(function (s) { return s.key === state.sede; })[0].label;
    var scopeLabel = sedeLabel + (state.ejecutiva !== 'ALL' ? ' · Ejecutiva: ' + state.ejecutiva : '');

    // Pendientes = casos que TODAVÍA no cuentan como resueltos (excluye los que el
    // equipo ya confirmó con cargo, esos se reclasifican en effectiveStatus()).
    var pendientes = (stats['Sin Match'] || 0) + (stats['Fuera de Rango de Fecha'] || 0);

    var html = '';
    html += '<div class="kpi-grid">';
    html += '<div class="card hero-card">';
    html += '<div class="hero-label">% de cargo ya resuelto &middot; ' + escapeHtml(scopeLabel) + '</div>';
    html += '<div class="hero-num" style="color:' + tierVar(pct) + '">' + pct1(pct) + '</div>';
    html += '<div class="hero-sub">' + fmtInt(cargoCount(stats)) + ' de ' + fmtInt(stats.total) + ' citas ya con cargo, fuera de rango, no aplica o confirmadas por el equipo &mdash; quedan <strong>' + fmtInt(pendientes) + ' pendientes</strong> por revisar</div>';
    html += '</div>';

    html += '<div class="stat-grid">';
    var order = ['Match Encontrado', 'Sin Match', 'Fuera de Rango de Fecha', 'No Aplica Cruce (regla)'];
    if (stats['Confirmado por Equipo']) order.push('Confirmado por Equipo');
    order.forEach(function (key) {
      var meta = STATUS_META[key];
      var n = stats[key] || 0;
      var p = stats.total ? (n / stats.total) * 100 : 0;
      html += '<div class="card stat">';
      html += '<div class="lbl"><span class="dot" style="background:var(' + meta.varName + ')"></span>' + escapeHtml(meta.short) + '</div>';
      html += '<div class="n" style="color:var(' + meta.varName + ')">' + fmtInt(n) + '</div>';
      html += '<div class="pct">' + pct1(p) + ' del total</div>';
      html += '</div>';
    });
    html += '</div>'; // stat-grid
    html += '</div>'; // kpi-grid
    root.innerHTML = html;
  }

  // ---------- render: grupo bars ----------
  function renderGrupoBars(root) {
    var scoped = scopedRecords();
    var groups = groupStats(scoped);
    var html = '<div class="card bars">';
    groups.forEach(function (g) {
      html += '<div class="bar-row">';
      html += '<div class="name">' + escapeHtml(g.grupo) + '</div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(g.pct, 1.5) + '%;background:' + tierVar(g.pct) + '"></div></div>';
      html += '<div class="bar-val">' + pct1(g.pct) + ' &middot; ' + fmtInt(g.total) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    root.innerHTML = html;
  }

  // ---------- render: detail table ----------
  function commentCellHtml(row) {
    var note = COMMENTS[row.id] || { text: '', cargado: false };
    var disabledAttr = artifactReady ? '' : 'disabled';
    var html = '<label class="confirm-check">' +
      '<input type="checkbox" class="confirm-checkbox" data-id="' + escapeHtml(row.id) + '" ' + (note.cargado ? 'checked' : '') + ' ' + disabledAttr + '>' +
      ' Ya tiene cargo (confirmado)</label>';
    html += '<textarea class="comment-input" data-id="' + escapeHtml(row.id) + '" placeholder="Agregar comentario…" ' + disabledAttr + '>' + escapeHtml(note.text || '') + '</textarea>';
    html += '<div class="save-state" data-savestate="' + escapeHtml(row.id) + '"></div>';
    return html;
  }

  function renderTable(root) {
    var rows = detailRows();
    var html = '';
    html += '<div class="toolbar">';
    html += '<input class="search" id="fi-search" type="text" placeholder="Buscar por paciente, concepto, profesional o NHC…" value="' + escapeHtml(state.search) + '">';
    html += '<select class="pill" id="fi-grupo-filter" style="cursor:pointer">';
    html += '<option value="ALL"' + (state.grupo === 'ALL' ? ' selected' : '') + '>Todos los grupos</option>';
    GRUPO_ORDER.forEach(function (g) {
      html += '<option value="' + escapeHtml(g) + '"' + (state.grupo === g ? ' selected' : '') + '>' + escapeHtml(g) + '</option>';
    });
    html += '</select>';
    html += '<span class="count-badge">' + fmtInt(rows.length) + ' registros</span>';
    html += '</div>';

    if (!rows.length) {
      html += '<div class="table-wrap"><div class="empty">No hay registros con estos filtros.</div></div>';
      root.innerHTML = html;
      return;
    }

    html += '<div class="table-wrap"><table><thead><tr>' +
      '<th>Grupo</th><th>Sede</th><th>Paciente</th><th>Fecha cita</th><th>Concepto agenda</th>' +
      '<th>Estatus</th><th>Cargo candidato</th><th>Dif. días</th><th>Profesional</th><th>Ejecutiva</th><th>Comentario</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (r) {
      var meta = STATUS_META[r.estatus];
      var chipClass = r.estatus === 'Sin Match' ? 'sin' : 'fuera';
      var confirmado = COMMENTS[r.id] && COMMENTS[r.id].cargado;
      html += '<tr' + (confirmado ? ' class="row-confirmed"' : '') + '>';
      html += '<td>' + escapeHtml(r.grupo) + '</td>';
      html += '<td><span class="chip sede">' + escapeHtml(r.sede) + '</span></td>';
      html += '<td>' + escapeHtml(r.paciente) + (r.nhc ? '<br><span style="color:var(--muted);font-size:11px">' + escapeHtml(r.nhc) + '</span>' : '') + '</td>';
      html += '<td>' + fmtDate(r.fecha) + '</td>';
      html += '<td>' + escapeHtml(r.concepto) + '</td>';
      html += '<td><span class="chip ' + chipClass + '">' + escapeHtml(meta.short) + '</span>' + (confirmado ? ' <span class="chip confirm">✓ Confirmado</span>' : '') + '</td>';
      if (r.estatus === 'Fuera de Rango de Fecha') {
        html += '<td class="cargo-cell"><span class="cc">' + escapeHtml(r.conceptoCargo) + '</span>' + fmtDate(r.fechaCargo) + '</td>';
        html += '<td class="diff">' + (r.diffDias > 0 ? '+' : '') + r.diffDias + 'd</td>';
      } else {
        html += '<td class="cargo-cell">—</td><td class="diff">—</td>';
      }
      html += '<td>' + escapeHtml(r.profesional) + '</td>';
      html += '<td>' + (r.ejecutiva === 'Sin asignar' ? '<span class="chip" style="background:var(--warn-bg);color:var(--warn)">Sin asignar</span>' : escapeHtml(r.ejecutiva)) + '</td>';
      html += '<td>' + commentCellHtml(r) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    root.innerHTML = html;
    wireCommentInputs(root);
  }

  // ---------- render: pills ----------
  function renderSedePills(root) {
    var html = '';
    SEDES.forEach(function (s) {
      html += '<button class="pill' + (state.sede === s.key ? ' active' : '') + '" data-sede="' + s.key + '">' + escapeHtml(s.label) + '</button>';
    });
    root.innerHTML = html;
  }

  function renderEjecutivaFilter(root) {
    var html = '<select class="pill" id="fi-ejecutiva-filter" style="cursor:pointer">';
    html += '<option value="ALL"' + (state.ejecutiva === 'ALL' ? ' selected' : '') + '>Todas las ejecutivas</option>';
    getEjecutivas().forEach(function (e) {
      html += '<option value="' + escapeHtml(e) + '"' + (state.ejecutiva === e ? ' selected' : '') + '>' + escapeHtml(e) + '</option>';
    });
    html += '</select>';
    root.innerHTML = html;
  }

  function renderStatusPills(root) {
    var opts = [
      { key: 'ALL', label: 'Sin Match + Fuera de Rango' },
      { key: 'SIN', label: 'Solo Sin Match' },
      { key: 'FUERA', label: 'Solo Fuera de Rango' }
    ];
    var html = '';
    opts.forEach(function (o) {
      html += '<button class="pill' + (state.statusFilter === o.key ? ' active' : '') + '" data-status="' + o.key + '">' + escapeHtml(o.label) + '</button>';
    });
    root.innerHTML = html;
  }

  // ---------- full render ----------
  function render() {
    renderSedePills(document.getElementById('fi-sede-pills'));
    renderEjecutivaFilter(document.getElementById('fi-ejecutiva-filter-wrap'));
    renderKPI(document.getElementById('fi-kpi'));
    renderGrupoBars(document.getElementById('fi-bars'));
    renderStatusPills(document.getElementById('fi-status-pills'));
    renderTable(document.getElementById('fi-table'));
    wireTopEvents();
  }

  function wireTopEvents() {
    var sedePills = document.querySelectorAll('#fi-sede-pills .pill');
    sedePills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.sede = btn.getAttribute('data-sede');
        render();
      });
    });
    var statusPills = document.querySelectorAll('#fi-status-pills .pill');
    statusPills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.statusFilter = btn.getAttribute('data-status');
        renderTable(document.getElementById('fi-table'));
        renderStatusPillsOnly();
      });
    });
    var searchEl = document.getElementById('fi-search');
    if (searchEl) {
      searchEl.addEventListener('input', function () {
        state.search = searchEl.value;
        renderTable(document.getElementById('fi-table'));
        // restore focus + caret since table re-renders
        var el = document.getElementById('fi-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var grupoSel = document.getElementById('fi-grupo-filter');
    if (grupoSel) {
      grupoSel.addEventListener('change', function () {
        state.grupo = grupoSel.value;
        renderTable(document.getElementById('fi-table'));
      });
    }
    var ejecutivaSel = document.getElementById('fi-ejecutiva-filter');
    if (ejecutivaSel) {
      ejecutivaSel.addEventListener('change', function () {
        state.ejecutiva = ejecutivaSel.value;
        render();
      });
    }
  }

  function renderStatusPillsOnly() {
    renderStatusPills(document.getElementById('fi-status-pills'));
    var statusPills = document.querySelectorAll('#fi-status-pills .pill');
    statusPills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.statusFilter = btn.getAttribute('data-status');
        renderTable(document.getElementById('fi-table'));
        renderStatusPillsOnly();
      });
    });
  }

  // ---------- comments ----------
  function wireCommentInputs(root) {
    var inputs = root.querySelectorAll('.comment-input');
    inputs.forEach(function (el) {
      el.addEventListener('input', function () {
        var id = el.getAttribute('data-id');
        var stateEl = root.querySelector('[data-savestate="' + cssEscape(id) + '"]');
        if (stateEl) stateEl.textContent = 'Escribiendo…';
        if (saveTimers[id]) clearTimeout(saveTimers[id]);
        saveTimers[id] = setTimeout(function () { saveRow(id, { text: el.value }, stateEl, false); }, 900);
      });
    });
    var checks = root.querySelectorAll('.confirm-checkbox');
    checks.forEach(function (el) {
      el.addEventListener('change', function () {
        var id = el.getAttribute('data-id');
        var stateEl = root.querySelector('[data-savestate="' + cssEscape(id) + '"]');
        updateRowConfirmedVisual(el, el.checked);
        // El checkbox cambia el % de cargo (KPIs y barras), así que sí se re-renderiza esa parte.
        saveRow(id, { cargado: el.checked }, stateEl, true);
      });
    });
  }

  function updateRowConfirmedVisual(checkboxEl, checked) {
    var tr = checkboxEl.closest('tr');
    if (!tr) return;
    tr.classList.toggle('row-confirmed', checked);
    var estatusCell = tr.querySelector('td:nth-child(6)');
    if (!estatusCell) return;
    var existingChip = estatusCell.querySelector('.chip.confirm');
    if (checked && !existingChip) {
      var span = document.createElement('span');
      span.className = 'chip confirm';
      span.style.marginLeft = '6px';
      span.textContent = '✓ Confirmado';
      estatusCell.appendChild(span);
    } else if (!checked && existingChip) {
      existingChip.remove();
    }
  }

  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  function saveRow(id, patch, stateEl, rerenderStats) {
    var current = COMMENTS[id] || { text: '', cargado: false };
    var next = { text: patch.text !== undefined ? patch.text.trim() : (current.text || ''), cargado: patch.cargado !== undefined ? patch.cargado : !!current.cargado };
    if (next.text || next.cargado) COMMENTS[id] = next; else delete COMMENTS[id];

    if (rerenderStats) {
      renderKPI(document.getElementById('fi-kpi'));
      renderGrupoBars(document.getElementById('fi-bars'));
    }

    if (!artifactReady || !artifactApi) {
      if (stateEl) stateEl.textContent = 'Sin conexión de guardado — no se compartirá con el equipo';
      return;
    }
    if (stateEl) stateEl.textContent = 'Guardando…';
    artifactApi.publish(buildFullDocument(COMMENTS)).then(function () {
      if (stateEl) stateEl.textContent = 'Guardado ✓ — visible para todo el equipo';
    }).catch(function () {
      if (stateEl) stateEl.textContent = 'No se pudo guardar (alguien más publicó un cambio) — vuelve a intentar';
    });
  }

  // ---------- republish document builder ----------
  function findOwnStyleEl() {
    var byId = document.getElementById('fi-style');
    if (byId) return byId;
    var all = document.querySelectorAll('style');
    if (!all.length) return null;
    var best = all[0];
    for (var i = 1; i < all.length; i++) {
      if (all[i].textContent.length > best.textContent.length) best = all[i];
    }
    return best;
  }
  function findOwnFontLinkEl() {
    var byId = document.getElementById('fi-font-link');
    if (byId) return byId;
    var all = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < all.length; i++) {
      if ((all[i].getAttribute('href') || '').indexOf('fonts.googleapis.com') !== -1) return all[i];
    }
    return all.length ? all[0] : null;
  }

  function buildFullDocument(commentsObj) {
    var styleEl = findOwnStyleEl();
    var fontEl = findOwnFontLinkEl();
    var styleHtml = styleEl ? styleEl.outerHTML : '';
    var fontLink = fontEl ? fontEl.outerHTML : '';
    var appSrc = document.getElementById('fi-app-src').textContent;
    var dataJson = JSON.stringify(DATA);
    var commentsJson = JSON.stringify(commentsObj);
    var boot = "window.__FI_DATA__=" + dataJson + ";window.__FI_COMMENTS__=" + commentsJson + ";";

    return '<!doctype html><html><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>Cruce de Cargos</title>' +
      styleHtml + fontLink +
      '</head><body>' +
      '<div id="root"></div>' +
      '<script>' + boot + '<' + '/script>' +
      '<script id="fi-app-src">' + appSrc + '<' + '/script>' +
      '</body></html>';
  }

  // ---------- boot ----------
  function initCapability() {
    if (!window.claude || typeof window.claude.use !== 'function') {
      showReadOnlyBanner();
      return;
    }
    window.claude.use('artifact').then(function (api) {
      if (!api) { showReadOnlyBanner(); return; }
      artifactApi = api;
      artifactReady = true;
      hideReadOnlyBanner();
      render();
    }).catch(function () { showReadOnlyBanner(); });
  }

  function showReadOnlyBanner() {
    var b = document.getElementById('fi-readonly-banner');
    if (b) b.style.display = 'block';
  }
  function hideReadOnlyBanner() {
    var b = document.getElementById('fi-readonly-banner');
    if (b) b.style.display = 'none';
  }

  function buildShell() {
    var root = document.getElementById('root');
    var html = '';
    html += '<div class="topbar"><div class="topbar-inner">' +
      '<div class="brand"><h1>Cruce de Cargos</h1><p>Fertilidad Integral &middot; Revenue Management &middot; corte al ' + CORTE_LABEL + '</p></div>' +
      '<div class="pillrow" id="fi-sede-pills"></div>' +
      '<div class="pillrow" id="fi-ejecutiva-filter-wrap"></div>' +
      '</div></div>';
    html += '<div id="root-body">' +
      '<div class="readonly-banner" id="fi-readonly-banner" style="display:none">Esta vista no tiene conexión de guardado activa: los comentarios se pueden escribir pero no se compartirán con el equipo hasta que se abra desde una sesión con guardado habilitado.</div>' +
      '<section><div class="section-head"><h2>% de conversión</h2><div class="note">Qué tanto de la agenda ya quedó resuelto: tiene cargo, está fuera de rango (para revisar), no requiere cargo por regla, o el equipo ya confirmó que sí se cobró. <strong>No es lo que falta</strong> — entre más alto, mejor.</div></div>' +
      '<div id="fi-kpi"></div></section>' +
      '<section><div class="section-head"><h2>Distribución por grupo</h2><div class="note">% ya resuelto de cada tipo de cita (mismo criterio de arriba), de mayor a menor. Un grupo con % bajo es el que más casos pendientes tiene por revisar.</div></div>' +
      '<div id="fi-bars"></div></section>' +
      '<section><div class="section-head"><h2>Casos a revisar</h2><div class="note">Comenta si detectas que falta una regla, un concepto de cargo o una excepción — sirve como conocimiento para el equipo. Si confirmas "Ya tiene cargo", ese caso se suma al % de cargo de arriba.</div></div>' +
      '<div class="pillrow" id="fi-status-pills" style="margin-bottom:14px"></div>' +
      '<div id="fi-table"></div></section>' +
      '<footer>Fertilidad Integral — Auditoría de cruce Agenda vs. Cargos</footer>' +
      '</div>';
    root.innerHTML = html;
  }

  buildShell();
  render();
  initCapability();

  window.__fi_buildFullDocument = buildFullDocument;
})();

</script>

</body></html>
